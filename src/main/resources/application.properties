# ==========================================
# PROFILS & CONFIGURATION GÉNÉRALE
# ==========================================
# Nom de l'application utilisé dans les logs et métriques Spring Boot
spring.application.name=yooniApp
# Profil actif par défaut (dev en local, prod via variable d'environnement)
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ==========================================
# SERVEUR HTTP
# ==========================================
# Port HTTP sur lequel Tomcat écoute les requêtes 
server.port=${SERVER_PORT}
# Encodage UTF-8 forcé sur toutes les requêtes HTTP entrantes et sortantes
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# Messages d'erreur détaillés JAMAIS exposés par défaut (sécurité).
# Le profil "dev" les active explicitement ; le profil "prod" les désactive.
server.error.include-message=never
server.error.include-binding-errors=never

# ==========================================
# CONNEXION BASE DE DONNÉES MYSQL (XAMPP)
# ==========================================
# URL JDBC vers MySQL (variable d'environnement avec fallback local pour XAMPP)
spring.datasource.url=${DB_URL}
# Identifiant MySQL (variable d'environnement avec fallback local)
spring.datasource.username=${USER_NAME}
# Mot de passe MySQL via variable d'environnement (sécurité : jamais en dur dans le code)
spring.datasource.password=${MOT_DE_PASSE}
# Driver JDBC officiel MySQL chargé d'exécuter les requêtes SQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# GESTION DU POOL DE CONNEXIONS (HIKARI CP)
# ==========================================
# Nombre maximal de connexions simultanées ouvertes vers MySQL (pour soutenir une forte charge)
spring.datasource.hikari.maximum-pool-size=20
# Nombre minimal de connexions inactives maintenues prêtes dans le pool
spring.datasource.hikari.minimum-idle=5
# Temps d'attente maximal en ms pour obtenir une connexion du pool avant de rejeter
spring.datasource.hikari.connection-timeout=30000
# Durée maximale d'inactivité en ms avant qu'une connexion du pool soit fermée
spring.datasource.hikari.idle-timeout=600000

# ==========================================
# CONFIGURATION JPA / HIBERNATE (ORM)
# ==========================================
# validate = Hibernate vérifie que les tables correspondent aux entités (Flyway gère la création)
spring.jpa.hibernate.ddl-auto=validate
# Désactive OSIV pour éviter les requêtes N+1 et LazyInitializationException
spring.jpa.open-in-view=false
# Affiche les SQL en console (false par défaut, true pour le débogage via variable d'environnement)
spring.jpa.show-sql=${SHOW_SQL}
# Formate le SQL affiché pour faciliter la lecture
spring.jpa.properties.hibernate.format_sql=true
# Ajoute des commentaires SQL pour identifier l'origine de chaque requête
spring.jpa.properties.hibernate.use_sql_comments=true

# ==========================================
# FLYWAY - MIGRATIONS VERSIONNÉES
# ==========================================
# Active Flyway au démarrage de l'application
spring.flyway.enabled=true
# Répertoire contenant les scripts SQL de migration
spring.flyway.locations=classpath:db/migration
# Table de suivi des migrations dans MySQL
spring.flyway.table=flyway_schema_history
# Autorise Flyway à exécuter des migrations sur un schéma managé
spring.flyway.baseline-on-migrate=true

# ==========================================
# SÉCURITÉ & JETONS JWT (JSON WEB TOKEN)
# ==========================================
# Clé secrète HMAC SHA-256 via variable d'environnement.
# ⚠️ Le fallback ci-dessous est UNIQUEMENT une clé de développement aléatoire.
# En production, JWT_SECRET DOIT impérativement être défini (>= 256 bits aléatoires).
yooni.app.jwtSecret=${CLE_JWT}
# Durée de validité du token d'accès JWT en ms (24 heures = 86 400 000 ms)
yooni.app.jwtExpirationMs=${EXPIRE_JWT}
# Durée de validité du Refresh Token en ms (7 jours = 604 800 000 ms)
yooni.app.jwtRefreshExpirationMs=${RENOUVELLE_JWT}

# ==========================================
# GESTION DES FICHIERS & UPLOADS (PERMIS, PHOTOS)
# ==========================================
# Taille maximale autorisée pour un seul fichier envoyé (ex: pièce d'identité ou permis chauffeur)
spring.servlet.multipart.max-file-size=10MB
# Taille maximale globale d'une requête HTTP contenant plusieurs fichiers
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# FORMATAGE DES DONNÉES REST (JACKSON JSON)
# ==========================================
# Ignore les attributs aux valeurs 'null' dans les réponses JSON pour réduire la taille des payloads
spring.jackson.default-property-inclusion=non_null
# Empêche Jackson de convertir les dates en nombres entiers (timestamps) → format ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false
# Évite une erreur si un bean sérialisé est vide (évite EmptyBeanException)
spring.jackson.serialization.fail-on-empty-beans=false
# Fuseau horaire pour le formatage des dates JSON (Sénégal = UTC+0)
spring.jackson.time-zone=Africa/Dakar

# ==========================================
# AUDIT & LOGS
# ==========================================
# Niveau de log pour la logique métier (INFO par défaut, DEBUG via variable d'environnement)
logging.level.sn.yooni=${LOG_LEVEL_YOONI}
# Niveau de log de Spring Security (INFO trace les tentatives de connexion et d'accès refusés)
logging.level.org.springframework.security=${LOG_LEVEL_SP}
# Fichier cible dans lequel les logs complets de l'application sont enregistrés
logging.file.name=logs/yooni-app.log

# ==========================================
# ROTATION DES FICHIERS LOGS
# ==========================================
# Taille maximale de chaque fichier log avant rotation (10 Mo)
logging.logback.rollingpolicy.max-file-size=10MB
# Nombre maximum de fichiers log conservés (30 fichiers ≈ 30 jours)
logging.logback.rollingpolicy.max-history=30
# Taille totale maximale de tous les fichiers log combinés (300 Mo)
logging.logback.rollingpolicy.total-size-cap=300MB
# Supprime les anciens logs au démarrage de l'application (surchargé à false en production)
logging.logback.rollingpolicy.clean-history-on-start=true